; Claude Usage Meter - ESP8266 + ST7789 240x240 (GeekMagic SmallTV-style board)

[env:meter]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
monitor_speed = 115200
upload_speed = 460800

lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.2.1

build_flags =
  -O2
  ; ---- TFT_eSPI setup (no User_Setup.h edits needed) ----
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=-1
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_SPI_MODE=SPI_MODE3
  -D SPI_FREQUENCY=40000000
  -D SMOOTH_FONT=1
  -D DISABLE_ALL_LIBRARY_WARNINGS=1

; Wireless (OTA) update after the first USB flash:
;   METER_TOKEN=<token from src/secrets.h> pio run -e ota -t upload
[env:ota]
extends = env:meter
upload_protocol = espota
upload_port = claude-meter.local
upload_flags =
  --auth=${sysenv.METER_TOKEN}
